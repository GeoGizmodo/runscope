[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "runscope"
version = "0.1.6"
description = "Calibrated ETAs and completion intelligence for long-running jobs (a smarter progress bar)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "RunScope" }]
keywords = [
    "progress", "progress-bar", "eta", "estimation", "tqdm",
    "remaining-time", "cli", "data-processing", "hpc", "runtime",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = []          # core client is dependency-free (pure stdlib)

[project.optional-dependencies]
cloud = ["requests>=2.25"]  # only needed for Pro cloud sync

[project.urls]
Homepage = "https://runscope.dev"
Documentation = "https://runscope.dev/docs"
Source = "https://github.com/runscope/runscope"
Issues = "https://github.com/runscope/runscope/issues"
Changelog = "https://github.com/runscope/runscope/blob/main/CHANGELOG.md"

[project.scripts]
runscope = "runscope.cli:main"

[tool.setuptools.packages.find]
include = ["runscope*"]
